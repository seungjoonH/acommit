# .acommit.yml (English template)
# -----------------------------------------------------------------------------
# acommit config. Tweak to fit your team's conventions.
# - All keys are optional; unspecified ones fall back to defaults.
# - Keep rich comments so the intent is clear in PRs.
# -----------------------------------------------------------------------------

version: 1  # schema version

tags:
  enabled: true
  list: [feat, fix, docs, chore, refactor, test, perf, build, ci]
  # style placeholders:
  #   {tag}  : lowercase (feat)
  #   {TAG}  : UPPERCASE (FEAT)
  #   {Tag}  : Capitalized (Feat)
  #   {scope}: scope string, if enabled
  #   {sep}  : separator string
  # examples:
  #   "[{TAG}]"  -> "[FEAT] message"
  #   "{tag}:"   -> "feat: message"
  #   "{Tag}{sep}" -> "Feat message"
  style: "{tag}:"
  separator: " "

message:
  language: "en"            # "en" | "ko"
  # style:
  # - verb        : short verb/noun phrases ("add init", "update config")
  # - declarative : declarative (~s)           ("adds initial setup")
  # - imperative  : imperative English         ("Add initial setup")
  # - past        : past tense                 ("Added initial setup")
  style: "imperative"
  tone: "concise"           # "concise" | "detailed"
  lines: "single"           # "single" | "multi"
  wrap: 72                  # subject line guide (0 = unlimited)
  emoji:
    enabled: false
    map:
      feat: "✨"
      fix: "🐛"
      docs: "📝"
      chore: "🔧"

grouping:
  mode: "per-file"          # per-file | by-tag | by-directory | none
  directoryDepth: 1
  minFilesPerGroup: 2

diff:
  includeBinary: false
  untrackedSizeLimit: 512000
  context: 3

ignore:
  files:
    - "package-lock.json"
    - "*.lock"
    - "dist/**"
  tagsForPaths:
    "docs/**": "docs"
    "scripts/**": "chore"

llm:
  provider: "gemini"        # "gemini" | "openai" | "ollama" ...
  model: "gemini-2.5-flash"
  maxPromptTokens: 200000
  maxOutputTokens: 4000

conventional:
  compatible: false         # when true, generate "type(scope): subject"
  scope:
    enabled: false
    inferFromPath: true
    # when enabled and style uses {scope}, e.g.:
    #   style: "{tag}({scope}):" -> "feat(helper): message"